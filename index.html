<html lang="pt-BR" class="i18n-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camila Galinari</title>
<meta name="description" content="">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Poppins:wght@300;400;500;600;700&display=swap">
<script>
  /* reduzir movimento: respeita o sistema; ?movimento na URL força as animações (para revisar o design) */
  (function () {
    var forcar = /[?&]movimento/.test(location.search);
    var reduz = !forcar && window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.classList.toggle("reduce-motion", reduz);
    window.CG_REDUCE = reduz;
  })();
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/secoes.css">
<link rel="stylesheet" href="css/secoes-4.css">
<link rel="stylesheet" href="css/secoes-5.css">
<link rel="stylesheet" href="css/contato.css">
</head>
<body>

<!-- ============ HEADER FIXO: barra sazonal + menu ============ -->
<header class="site-header" id="siteHeader">

  <a class="promo-bar" id="promoBar" href="#contato">
    <span class="promo-viewport" aria-hidden="true">
      <span class="promo-track" id="promoTrack"></span>
    </span>
    <span class="promo-cta" data-i18n="promo.cta"></span>
  </a>

  <nav class="nav" aria-label="Principal">
    <a class="nav-logo" href="#inicio" id="navLogo" data-i18n-attr="aria-label:nav.home">
      <span class="nav-logo-first" data-i18n="brand.first"></span>
      <span class="nav-logo-last" data-i18n="brand.last"></span>
    </a>

    <div class="nav-drawer" id="navDrawer">
      <a class="nav-link" href="#servicos" data-i18n="nav.servicos"></a>
      <a class="nav-link" href="#nichos" data-i18n="nav.nichos"></a>
      <a class="nav-link" href="#metricas" data-i18n="nav.metricas"></a>
      <button class="lang-toggle" id="langToggle" type="button" data-i18n-attr="aria-label:nav.idiomaLabel">
        <span class="lang-opt" data-lang="pt" data-sketch="circle" data-sketch-pad="10 9" data-sketch-seed="11" data-sketch-trigger="load"><span data-i18n="nav.pt"></span></span>
        <span class="lang-sep" aria-hidden="true">|</span>
        <span class="lang-opt" data-lang="en" data-sketch="circle" data-sketch-pad="10 9" data-sketch-seed="12" data-sketch-trigger="load"><span data-i18n="nav.en"></span></span>
      </button>
    </div>

    <a class="nav-cta" href="#contato" data-sketch="highlight" data-sketch-seed="7" data-sketch-trigger="load" data-sketch-delay="600"><span data-i18n="nav.cta"></span></a>

    <button class="nav-burger" id="navBurger" type="button" aria-expanded="false" aria-controls="navDrawer">
      <span></span><span></span>
    </button>
  </nav>
</header>

<main>

  <!-- ============ 1. HERO ============ -->
  <section id="inicio" class="hero">

    <!-- camada 2: palavras fantasma -->
    <div class="hero-ghost" aria-hidden="true">
      <span class="ghost g1" data-i18n="hero.ghost.g1"></span>
      <span class="ghost g2" data-i18n="hero.ghost.g2"></span>
      <span class="ghost g3" data-i18n="hero.ghost.g3"></span>
      <span class="ghost g4" data-i18n="hero.ghost.g4"></span>
    </div>

    <!-- camada 3 e 4: foto + anotações (posicionadas em relação à foto) -->
    <div class="hero-stage">
      <span class="hero-shadow" aria-hidden="true"></span>
      <span class="hero-photo-wrap"><picture><source srcset="img/hero-camila.webp" type="image/webp"><img class="hero-photo" src="img/hero-camila.png" width="1453" height="1700" data-i18n-attr="alt:hero.fotoAlt" fetchpriority="high"></picture></span>

      <div class="hero-notes" aria-hidden="true">
        <div class="anot anot-tiktok" style="--i:0">
          <span class="hand hand-lg" data-sketch="circle" data-sketch-seed="31" data-sketch-pad="18 14" data-sketch-trigger="load" data-sketch-delay="1150"><span data-i18n="hero.anot.tiktok"></span></span>
        </div>

        <div class="anot anot-mae" style="--i:1">
          <span class="hand" data-i18n="hero.anot.mae"></span>
          <span class="anot-arrow d-only" data-sketch="arrow" data-sketch-seed="32" data-sketch-trigger="load" data-sketch-delay="1430" data-sketch-arrow="0.08 0.04 0.86 0.94 -0.3"></span>
          <span class="anot-arrow m-only" data-sketch="arrow" data-sketch-seed="33" data-sketch-trigger="load" data-sketch-delay="1430" data-sketch-arrow="0.2 0.05 0.7 0.95 0.3"></span>
        </div>

        <div class="anot anot-eng" style="--i:2">
          <span class="hand" data-sketch="circle" data-sketch-seed="34" data-sketch-pad="16 12" data-sketch-trigger="load" data-sketch-delay="1710"><span data-i18n="hero.anot.engenheira"></span></span>
        </div>

        <div class="anot anot-live d-only" style="--i:3">
          <span class="anot-arrow" data-sketch="arrow" data-sketch-seed="35" data-sketch-trigger="load" data-sketch-delay="1990" data-sketch-arrow="0.95 0.12 0.06 0.88 0.32"></span>
          <span class="hand" data-i18n="hero.anot.live"></span>
        </div>

        <div class="anot anot-idade d-only" style="--i:4">
          <span class="hand hero-idade" data-i18n-age></span>
        </div>

        <div class="anot anot-casada d-only" style="--i:5">
          <span class="hand" data-i18n="hero.anot.casada"></span>
        </div>

        <div class="anot anot-pet d-only" style="--i:6">
          <span class="hand" data-sketch="underline" data-sketch-seed="36" data-sketch-trigger="load" data-sketch-delay="2830"><span data-i18n="hero.anot.pet"></span></span>
        </div>

        <div class="anot anot-local" style="--i:7">
          <span class="anot-pin" data-sketch="pin" data-sketch-seed="37" data-sketch-trigger="load" data-sketch-delay="3050"></span>
          <span class="hand" data-i18n="hero.anot.local"></span>
        </div>
      </div>
    </div>

    <!-- textos principais -->
    <h1 class="hero-name">
      <span class="hero-first">
        <span class="hero-kicker" data-i18n="hero.kicker"></span>
        <span data-i18n="brand.first"></span>
      </span>
      <span class="hero-last">
        <span data-i18n="brand.last"></span>
        <span class="hero-year" data-i18n="hero.portfolio"></span>
      </span>
    </h1>

    <!-- mobile: anotações restantes viram tags manuscritas -->
    <ul class="hero-tags m-only">
      <li class="hand hero-idade" data-i18n-age></li>
      <li class="hand" data-i18n="hero.anot.casada"></li>
      <li class="hand" data-i18n="hero.anot.live"></li>
      <li class="hand" data-i18n="hero.anot.pet"></li>
    </ul>
  </section>

  <!-- ============ SEÇÕES FUTURAS (placeholders, uma por etapa) ============ -->
  <!-- ============ 2. MARCAS TRABALHADAS ============ -->
  <section id="marcas" class="marcas" aria-labelledby="marcasTitulo">
    <h2 class="marcas-titulo" id="marcasTitulo" data-i18n="marcas.titulo"></h2>
    <div class="marquee marquee-logos">
      <div class="marquee-track" id="logosTrack"></div>
    </div>
  </section>

  <!-- ============ 3. CONTEÚDOS QUE BOMBARAM ============ -->
  <section id="destaques" class="destaques">
    <div class="wrap destaques-grid">
      <div class="destaques-texto reveal">
        <p class="eyebrow" data-i18n="destaques.eyebrow"></p>
        <h2 class="sec-title" data-i18n-html="destaques.titulo"></h2>
        <p data-i18n-html="destaques.texto.0"></p>
        <p data-i18n-html="destaques.texto.1"></p>
        <p data-i18n-html="destaques.texto.2"></p>
        <p data-i18n-html="destaques.texto.3"></p>
        <p class="destaques-fecho"><span data-sketch="underline" data-sketch-seed="41" data-sketch-pad="0 12"><span data-i18n="destaques.fecho"></span></span></p>
      </div>

      <div class="cflow reveal" id="cflow">
        <div class="cflow-stage" id="cflowStage"></div>
        <button class="cflow-nav cflow-prev" type="button" data-dir="-1" data-i18n-attr="aria-label:destaques.anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="cflow-nav cflow-next" type="button" data-dir="1" data-i18n-attr="aria-label:destaques.proximo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div class="cflow-dots" id="cflowDots"></div>
      </div>
    </div>
  </section>

  <!-- lightbox genérico (matéria, fotos, prints) -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" type="button" data-i18n-attr="aria-label:destaques.fechar">&times;</button>
    <img class="lightbox-img" alt="">
  </div>

  <!-- ============ 4. SOFT SKILLS + HARD SKILLS (quadro branco) ============ -->
  <section id="skills" class="skills">
    <div class="wrap">
      <div class="board reveal">
        <span class="board-nota hand" data-i18n="skills.nota"></span>

        <div class="board-col">
          <h2 class="board-title"><span data-sketch="highlight" data-sketch-seed="51"><span data-i18n="skills.soft"></span></span></h2>
          <ul class="board-list">
            <li class="hand" style="--rot:-2deg;--x:0"><span data-sketch="underline" data-sketch-seed="52" data-sketch-delay="200"><span data-i18n="skills.softList.0"></span></span></li>
            <li class="hand" style="--rot:2.5deg;--x:1.4em"><span data-sketch="circle" data-sketch-seed="53" data-sketch-pad="14 10" data-sketch-delay="500"><span data-i18n="skills.softList.1"></span></span></li>
            <li class="hand" style="--rot:-1deg;--x:.4em"><span data-i18n="skills.softList.2"></span></li>
            <li class="hand" style="--rot:1.5deg;--x:2.2em"><span class="board-arrow" data-sketch="arrow" data-sketch-seed="54" data-sketch-delay="800" data-sketch-arrow="0.02 0.3 0.96 0.62 -0.35"></span><span data-i18n="skills.softList.3"></span></li>
            <li class="hand" style="--rot:-3deg;--x:.8em"><span data-sketch="highlight" data-sketch-seed="55" data-sketch-delay="1000"><span data-i18n="skills.softList.4"></span></span></li>
            <li class="hand" style="--rot:1deg;--x:0"><span data-sketch="underline" data-sketch-seed="56" data-sketch-delay="1200"><span data-i18n="skills.softList.5"></span></span></li>
            <li class="hand" style="--rot:-2deg;--x:1.8em"><span data-sketch="circle" data-sketch-seed="57" data-sketch-pad="14 10" data-sketch-delay="1400"><span data-i18n="skills.softList.6"></span></span></li>
          </ul>
        </div>

        <span class="board-divider" data-sketch="line" data-sketch-seed="58" data-sketch-arrow="0.5 0 0.5 1 0.02" aria-hidden="true"></span>

        <div class="board-col">
          <h2 class="board-title"><span data-sketch="highlight" data-sketch-seed="59"><span data-i18n="skills.hard"></span></span></h2>
          <ul class="board-list">
            <li class="hand" style="--rot:2deg;--x:.6em"><span data-sketch="circle" data-sketch-seed="60" data-sketch-pad="14 10" data-sketch-delay="300"><span data-i18n="skills.hardList.0"></span></span></li>
            <li class="hand" style="--rot:-1.5deg;--x:0"><span data-sketch="underline" data-sketch-seed="61" data-sketch-delay="500"><span data-i18n="skills.hardList.1"></span></span></li>
            <li class="hand" style="--rot:1deg;--x:1.6em"><span data-i18n="skills.hardList.2"></span></li>
            <li class="hand" style="--rot:-2.5deg;--x:.3em"><span data-sketch="highlight" data-sketch-seed="62" data-sketch-delay="800"><span data-i18n="skills.hardList.3"></span></span></li>
            <li class="hand" style="--rot:1.5deg;--x:2em"><span data-i18n="skills.hardList.4"></span></li>
            <li class="hand" style="--rot:-1deg;--x:.9em"><span data-sketch="underline" data-sketch-seed="63" data-sketch-delay="1100"><span data-i18n="skills.hardList.5"></span></span></li>
            <li class="hand" style="--rot:2deg;--x:0"><span data-i18n="skills.hardList.6"></span></li>
            <li class="hand" style="--rot:-2deg;--x:1.2em"><span class="board-arrow" data-sketch="arrow" data-sketch-seed="64" data-sketch-delay="1400" data-sketch-arrow="0.02 0.7 0.96 0.4 0.35"></span><span data-sketch="circle" data-sketch-seed="65" data-sketch-pad="14 10" data-sketch-delay="1600"><span data-i18n="skills.hardList.7"></span></span></li>
            <li class="hand" style="--rot:1deg;--x:.4em"><span data-sketch="underline" data-sketch-seed="66" data-sketch-delay="1800"><span data-i18n="skills.hardList.8"></span></span></li>
          </ul>
        </div>

        <span class="board-tray" aria-hidden="true"><i></i><i></i></span>
      </div>
    </div>
  </section>

  <!-- ============ 5. GALERIA POR NICHOS ============ -->
  <section id="nichos" class="galeria">
    <div class="wrap">
      <header class="galeria-head reveal">
        <p class="eyebrow" data-i18n="galeria.eyebrow"></p>
        <h2 class="sec-title galeria-title" data-i18n-html="galeria.titulo"></h2>
      </header>
      <nav class="nicho-menu" id="nichoMenu" data-i18n-attr="aria-label:galeria.menu"></nav>
      <div id="nichoBlocos"></div>

      <div class="yt-ads reveal" id="ytAds">
        <div class="nicho-head">
          <h3 class="nicho-nome yt-nome" data-i18n="galeria.ytTitulo"></h3>
          <p class="nicho-sub" data-i18n="galeria.ytSub"></p>
        </div>
        <div class="yt-player" id="ytPlayer"></div>
      </div>
    </div>
  </section>

  <!-- ============ 6. FOTOGRAFIA ============ -->
  <section id="fotografia" class="fotografia">
    <div class="wrap">
      <header class="foto-head reveal">
        <p class="eyebrow" data-i18n="fotografia.eyebrow"></p>
        <h2 class="sec-title" data-i18n="fotografia.titulo"></h2>
        <p class="foto-sub" data-i18n="fotografia.sub"></p>
      </header>
    </div>
    <div class="moodboard" id="moodboard"></div>
  </section>

  <!-- player de vídeo em tela cheia (galeria) -->
  <div class="vmodal" id="vmodal" hidden>
    <button class="lightbox-close vmodal-close" type="button" data-i18n-attr="aria-label:galeria.fechar">&times;</button>
    <div class="vmodal-frame" id="vmodalFrame"></div>
  </div>

  <!-- ============ 7. O QUE PODEMOS CRIAR JUNTOS? (seletor de objetivo) ============ -->
  <section id="servicos" class="servicos">
    <div class="wrap">
      <header class="servicos-head reveal">
        <h2 class="sec-title" data-i18n-html="servicos.titulo"></h2>
        <p class="servicos-sub" data-i18n="servicos.sub"></p>
      </header>
      <div class="obj" id="objetivos"></div>
      <div class="servicos-duvida reveal">
        <p class="hand" data-i18n="servicos.duvida"></p>
        <a class="btn btn-ink" href="#contato" data-servico-link="Ainda não sei"><span data-i18n="servicos.conversar"></span></a>
      </div>
    </div>
  </section>

  <!-- ============ 8. DEPOIMENTOS ============ -->
  <section id="depoimentos" class="depo">
    <div class="wrap depo-head reveal">
      <h2 class="sec-title" data-i18n-html="depoimentos.titulo"></h2>
      <p class="depo-sub" data-i18n="depoimentos.sub"></p>
    </div>
    <div class="depo-marquee" id="depoMarquee">

      <button class="nicho-seta" type="button" data-depo-dir="-1" data-i18n-attr="aria-label:depoimentos.anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>

    </div>
  </section>

  <!-- ============ 9. MÉTRICAS (colagem) ============ -->
  <section id="metricas" class="metricas">
    <div class="wrap">
      <header class="metricas-head reveal">
        <p class="eyebrow" data-i18n="metricas.eyebrow"></p>
        <h2 class="sec-title" data-i18n-html="metricas.titulo"></h2>
        <p class="metricas-sub" data-i18n="metricas.sub"></p>
      </header>

      <div class="mt-grid">
        <!-- bloco 1: TikTok Shop -->
        <article class="mt-card reveal" data-bloco="tiktok">
          <header class="mt-rede">
            <svg class="mt-ico" viewBox="0 0 32 32" aria-hidden="true"><path d="M17.2 4.6c.1 5.5-.1 11.1-.3 16.6 0 2.6-2.2 4.6-4.8 4.5-2.5-.1-4.5-2.2-4.3-4.8.1-2.5 2.3-4.4 4.8-4.2"/><path d="M17.3 5c.6 3.4 3.1 5.8 6.7 6.1"/></svg>
            <h3 class="mt-rede-nome">TikTok Shop</h3>
            <a class="mt-perfil" href="https://tiktok.com/@bycamisugc_" target="_blank" rel="noopener">@bycamisugc_ <span aria-hidden="true">↗</span></a>
          </header>
          <div class="mt-numero">
            <span class="mt-circulo" data-sketch="circle" data-sketch-seed="71" data-sketch-pad="18 14" data-sketch-width="2.2">
              <span class="mt-count" data-count="tiktok">0</span>
            </span>
            <span class="hand mt-anot mt-anot-2" style="--rot:-6deg" data-i18n="metricas.anot2"></span>
            <p class="mt-rotulo" data-i18n="metricas.tiktokRotulo"></p>
            <p class="mt-nota" data-i18n="metricas.tiktokNota"></p>
          </div>
          <div class="mt-prints" data-prints="tiktok">
            <div class="hand mt-anot mt-anot-1" style="--rot:3deg">
              <span data-i18n="metricas.anot1"></span>
              <span class="mt-seta" data-sketch="arrow" data-sketch-seed="72" data-sketch-delay="500" data-sketch-arrow="0.1 0.1 0.85 0.9 0.35"></span>
            </div>
          </div>
        </article>

        <!-- bloco 2: Instagram -->
        <article class="mt-card reveal" data-bloco="instagram">
          <header class="mt-rede">
            <svg class="mt-ico" viewBox="0 0 32 32" aria-hidden="true"><path d="M9.5 4.8c4.4-.4 8.8-.4 13.1.1 2.6.3 4.3 2.1 4.5 4.7.4 4.3.4 8.6-.1 12.9-.3 2.6-2.1 4.3-4.7 4.5-4.3.4-8.6.4-12.9-.1-2.6-.3-4.3-2.1-4.5-4.7-.4-4.3-.3-8.6.1-12.9.3-2.5 2-4.3 4.5-4.5z"/><path d="M16 11.2c2.8-.1 5 2 5 4.7.1 2.8-2 5-4.8 5.1-2.7 0-4.9-2.1-5-4.8 0-2.7 2.1-4.9 4.8-5z"/><path d="M22.6 8.9l.2.1"/></svg>
            <h3 class="mt-rede-nome">Instagram</h3>
            <a class="mt-perfil" href="https://instagram.com/bycamisugc" target="_blank" rel="noopener">@bycamisugc <span aria-hidden="true">↗</span></a>
          </header>
          <div class="mt-numero">
            <span class="mt-count" data-count="instagram">0</span>
            <span class="hand mt-anot mt-anot-4" style="--rot:5deg" data-i18n="metricas.anot4"></span>
            <p class="mt-rotulo" data-i18n="metricas.igRotulo"></p>
            <p class="mt-nota"><span data-sketch="underline" data-sketch-seed="73" data-sketch-delay="400"><span data-i18n="metricas.igNota"></span></span></p>
          </div>
          <div class="mt-prints" data-prints="instagram">
            <div class="hand mt-anot mt-anot-3" style="--rot:-3deg">
              <span data-i18n="metricas.anot3"></span>
              <span class="mt-seta" data-sketch="arrow" data-sketch-seed="74" data-sketch-delay="500" data-sketch-arrow="0.1 0.1 0.85 0.9 0.35"></span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </section>
